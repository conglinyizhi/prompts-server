name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Upgrade to latest toolchain
        run: ~/.moon/bin/moon upgrade --force

      - name: Setup PATH
        run: echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Build frontend
        run: |
          cd frontend
          pnpm install
          pnpm build

      - name: Generate embedded files
        run: |
          {
            echo 'pub let emb_paths : Array[String] = ['
            find frontend/dist -type f | sort | while read f; do
              path="/${f#frontend/dist/}"
              echo "  \"$path\","
            done
            echo ']'
            echo ''
            echo 'pub let emb_data : Array[String] = ['
            find frontend/dist -type f | sort | while read f; do
              b64=$(base64 -w0 < "$f")
              echo "  \"$b64\","
            done
            echo ']'
          } > embedded.mbt

      - name: Build backend (release)
        run: moon build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: prompts-server
          path: _build/native/release/build/prompts-server.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: prompts-server

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            下载 `prompts-server.exe` 后直接运行：
            ```bash
            chmod +x prompts-server.exe
            ./prompts-server.exe
            ```
          files: prompts-server.exe
